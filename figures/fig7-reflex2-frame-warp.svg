<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Segoe UI, Arial, sans-serif">
  <title>NVIDIA Reflex 2: Frame Warp and Predictive Inpainting</title>
  <rect width="960" height="390" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">NVIDIA Reflex 2: Late Camera Sampling, Frame Warp, and Predictive Inpainting</text>
  <defs>
    <marker id="ar7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ar7g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#76b900"/>
    </marker>
  </defs>

  <!-- Step 1: GPU Renders Frame N -->
  <g transform="translate(25,70)">
    <rect x="0" y="0" width="200" height="190" rx="10" fill="#eef4ff" stroke="#3a6bc4" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">1. GPU Renders Frame N</text>
    <text x="100" y="48" text-anchor="middle" font-size="12" fill="#444">Camera pose at t0</text>
    <rect x="25" y="62" width="150" height="90" fill="#dfe8f7" stroke="#3a6bc4" stroke-width="1.5"/>
    <circle cx="95" cy="107" r="16" fill="#3a6bc4"/>
    <line x1="95" y1="83" x2="95" y2="131" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="71" y1="107" x2="119" y2="107" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="100" y="172" text-anchor="middle" font-size="12" fill="#444">Reflex 1: no GPU render queue</text>
  </g>

  <!-- Step 2: CPU Late Input -->
  <g transform="translate(260,70)">
    <rect x="0" y="0" width="200" height="190" rx="10" fill="#fff4e5" stroke="#c77700" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">2. Latest Mouse Input</text>
    <text x="100" y="48" text-anchor="middle" font-size="12" fill="#444">CPU computes next camera (t1)</text>
    <rect x="25" y="62" width="150" height="90" fill="#fdf0dc" stroke="#c77700" stroke-width="1.5"/>
    <circle cx="95" cy="107" r="14" fill="#bbb" stroke-dasharray="3 2"/>
    <circle cx="122" cy="98" r="16" fill="#c77700"/>
    <path d="M95,107 L118,99" stroke="#1a1a1a" stroke-width="2"/>
    <text x="100" y="172" text-anchor="middle" font-size="12" fill="#444">Sampled right before scanout</text>
  </g>

  <!-- Step 3: Frame Warp + Disocclusion Holes -->
  <g transform="translate(495,70)">
    <rect x="0" y="0" width="200" height="190" rx="10" fill="#fde2e2" stroke="#c0392b" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">3. Frame Warp Shift</text>
    <text x="100" y="48" text-anchor="middle" font-size="12" fill="#444">Warped to t1; exposes holes</text>
    <rect x="25" y="62" width="150" height="90" fill="#dfe8f7" stroke="#888" stroke-width="1.5"/>
    <!-- Disocclusion strip at edge & around shifted object -->
    <rect x="155" y="62" width="20" height="90" fill="#c0392b" opacity="0.75"/>
    <circle cx="72" cy="114" r="16" fill="#3a6bc4"/>
    <path d="M88,98 A18,18 0 0,1 96,128" stroke="#c0392b" stroke-width="5" fill="none"/>
    <text x="100" y="172" text-anchor="middle" font-size="12" fill="#c0392b">Disocclusion gaps (red)</text>
  </g>

  <!-- Step 4: Predictive Inpainting -->
  <g transform="translate(730,70)">
    <rect x="0" y="0" width="205" height="190" rx="10" fill="#e9f7d9" stroke="#76b900" stroke-width="3"/>
    <text x="102" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">4. Predictive Inpainting</text>
    <text x="102" y="48" text-anchor="middle" font-size="12" fill="#444">Prior camera + color + depth</text>
    <rect x="27" y="62" width="150" height="90" fill="#cfe9a8" stroke="#76b900" stroke-width="1.5"/>
    <circle cx="72" cy="114" r="16" fill="#3a6bc4"/>
    <line x1="102" y1="83" x2="102" y2="131" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="78" y1="107" x2="126" y2="107" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="102" y="172" text-anchor="middle" font-size="12" fill="#2d5a00" font-weight="600">Holes filled → sent to display</text>
  </g>

  <!-- Arrows between boxes -->
  <line x1="227" y1="165" x2="256" y2="165" stroke="#555" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="462" y1="165" x2="491" y2="165" stroke="#555" stroke-width="2" marker-end="url(#ar7)"/>
  <line x1="697" y1="165" x2="726" y2="165" stroke="#76b900" stroke-width="2.5" marker-end="url(#ar7g)"/>

  <!-- Latency comparison bar -->
  <g transform="translate(60,285)" font-size="13" fill="#1a1a1a">
    <text x="0" y="18" font-weight="600">Typical PC latency (NVIDIA benchmark, THE FINALS @ 4K max):</text>
    <rect x="430" y="4" width="180" height="18" rx="4" fill="#c0392b"/><text x="618" y="18" fill="#444">Native: 56 ms</text>
    <rect x="430" y="28" width="90" height="18" rx="4" fill="#c77700"/><text x="528" y="42" fill="#444">Reflex 1 (Low Latency): 27 ms (~50% lower)</text>
    <rect x="430" y="52" width="46" height="18" rx="4" fill="#76b900"/><text x="484" y="66" fill="#1a1a1a" font-weight="600">Reflex 2 (Frame Warp): 14 ms (up to 75% lower)</text>
  </g>
</svg>
