<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Arial, sans-serif">
  <title>Frame pacing: CPU pacing (DLSS 3) versus hardware Flip Metering (Blackwell)</title>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Frame pacing: who decides when each frame reaches the screen</text>
  <defs>
    <marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- Row A: DLSS 3 -->
  <text x="30" y="78" font-size="16" font-weight="600" fill="#c77700">DLSS 3 (RTX 40): CPU-side pacing</text>
  <g font-size="14" text-anchor="middle" fill="#1a1a1a">
    <rect x="30" y="90" width="160" height="60" rx="8" fill="#eef4ff" stroke="#3a6bc4" stroke-width="2"/><text x="110" y="116">GPU renders</text><text x="110" y="136" font-size="12" fill="#444">real frames</text>
    <rect x="230" y="90" width="180" height="60" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="2"/><text x="320" y="116">CPU pacer</text><text x="320" y="136" font-size="12" fill="#444">timers, OS scheduling</text>
    <rect x="450" y="90" width="160" height="60" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/><text x="530" y="116">Present queue</text><text x="530" y="136" font-size="12" fill="#444">software</text>
    <rect x="650" y="90" width="280" height="60" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/><text x="790" y="116">Display scanout</text><text x="790" y="136" font-size="12" fill="#444">jitter from the CPU side carries through</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#af)"><line x1="190" y1="120" x2="228" y2="120"/><line x1="410" y1="120" x2="448" y2="120"/><line x1="610" y1="120" x2="648" y2="120"/></g>

  <!-- Row B: Blackwell -->
  <text x="30" y="200" font-size="16" font-weight="600" fill="#2d5a00">Blackwell (RTX 50): hardware Flip Metering</text>
  <g font-size="14" text-anchor="middle" fill="#1a1a1a">
    <rect x="30" y="212" width="160" height="60" rx="8" fill="#eef4ff" stroke="#3a6bc4" stroke-width="2"/><text x="110" y="238">GPU renders</text><text x="110" y="258" font-size="12" fill="#444">real + generated frames</text>
    <rect x="230" y="212" width="180" height="60" rx="8" fill="#e9f7d9" stroke="#76b900" stroke-width="2"/><text x="320" y="238">Frame queue</text><text x="320" y="258" font-size="12" fill="#444">frames wait for a flip slot</text>
    <rect x="450" y="212" width="200" height="60" rx="8" fill="#e9f7d9" stroke="#76b900" stroke-width="3"/><text x="550" y="238">Display engine</text><text x="550" y="258" font-size="12" fill="#444">hardware Flip Metering</text>
    <rect x="690" y="212" width="240" height="60" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="2"/><text x="810" y="238">Display scanout</text><text x="810" y="258" font-size="12" fill="#444">evenly spaced flips</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#af)"><line x1="190" y1="242" x2="228" y2="242"/><line x1="410" y1="242" x2="448" y2="242"/><line x1="650" y1="242" x2="688" y2="242"/></g>

  <!-- Notes -->
  <g font-size="14" fill="#1a1a1a">
    <text x="30" y="318" font-weight="600">What NVIDIA states</text>
    <text x="30" y="338" fill="#444">· DLSS 3 pacing is CPU-based, and its variability can compound as more frames are generated.</text>
    <text x="30" y="356" fill="#444">· Blackwell moves pacing logic into the display engine, and doubles its pixel processing for it.</text>
    <text x="30" y="374" fill="#444">· NVIDIA builds MFG on this Blackwell pacing path. It does not state the RTX 50 gate in those terms.</text>
  </g>
  <text x="30" y="404" font-size="13" fill="#444">Third-party analysis (not NVIDIA): the mfg-unlock project reports a CPU pacer inside sl.dlss_g.dll as the stand-in on Ada.</text>
</svg>
