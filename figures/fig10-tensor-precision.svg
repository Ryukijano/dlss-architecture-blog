<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif">
  <title>Tensor core generations and supported precisions</title>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Tensor cores by generation: what each one can compute</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#444">The 50 series adds precisions and datapath features. Its tensor core count is higher, but its SM count is the same.</text>

  <!-- column headers -->
  <rect x="30" y="72" width="900" height="44" rx="6" fill="#f2f2f2"/>
  <g font-size="15" font-weight="600" fill="#1a1a1a">
    <text x="50" y="100">Precision or feature</text>
    <text x="440" y="100" text-anchor="middle" fill="#3a6bc4">Ampere (3rd gen)</text>
    <text x="640" y="100" text-anchor="middle" fill="#c77700">Ada (4th gen)</text>
    <text x="840" y="100" text-anchor="middle" fill="#2d5a00">Blackwell (5th gen)</text>
  </g>

  <!-- rows: y = 116 + i*40 -->
  <g font-size="15" fill="#1a1a1a">
    <text x="50" y="142">FP16 / BF16</text>
    <text x="50" y="182">TF32</text>
    <text x="50" y="222">INT8</text>
    <text x="50" y="262">FP8 (E4M3 / E5M2)</text>
    <text x="50" y="302">FP4 (NVFP4)</text>
    <text x="50" y="342">2:4 structured sparsity</text>
    <text x="50" y="382">Headline AI number (NVIDIA)</text>
  </g>
  <g stroke="#e0e0e0"><line x1="30" y1="158" x2="930" y2="158"/><line x1="30" y1="198" x2="930" y2="198"/><line x1="30" y1="238" x2="930" y2="238"/><line x1="30" y1="278" x2="930" y2="278"/><line x1="30" y1="318" x2="930" y2="318"/><line x1="30" y1="358" x2="930" y2="358"/></g>

  <g font-size="15" text-anchor="middle">
    <text x="440" y="142" fill="#2d5a00">Yes</text><text x="640" y="142" fill="#2d5a00">Yes</text><text x="840" y="142" fill="#2d5a00">Yes</text>
    <text x="440" y="182" fill="#2d5a00">Yes (new)</text><text x="640" y="182" fill="#2d5a00">Yes</text><text x="840" y="182" fill="#2d5a00">Yes</text>
    <text x="440" y="222" fill="#2d5a00">Yes</text><text x="640" y="222" fill="#2d5a00">Yes</text><text x="840" y="222" fill="#2d5a00">Yes</text>
    <text x="440" y="262" fill="#888">No</text><text x="640" y="262" fill="#2d5a00">Yes</text><text x="840" y="262" fill="#2d5a00">Yes (2nd-gen engine)</text>
    <text x="440" y="302" fill="#888">No</text><text x="640" y="302" fill="#888">No</text><text x="840" y="302" fill="#2d5a00">Yes (new)</text>
    <text x="440" y="342" fill="#2d5a00">Yes</text><text x="640" y="342" fill="#2d5a00">Yes</text><text x="840" y="342" fill="#2d5a00">Yes</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1a1a1a">
    <text x="440" y="382">285 TFLOPS FP16 sparse</text>
    <text x="640" y="382">1,321 TOPS FP8 sparse</text>
    <text x="840" y="382">3,352 TOPS FP4 sparse</text>
  </g>

  <g font-size="13" fill="#444">
    <text x="50" y="414">The headline numbers use each generation's lowest supported precision, so they are not like-for-like.</text>
    <text x="50" y="434">Blackwell's gain is mostly precision support (FP4, FP8 engine) and scheduling, not a much larger SM array.</text>
    <text x="50" y="454">Consumer Blackwell (sm_120) does not have the datacenter Tensor Memory (TMEM) found on GB100/B200.</text>
  </g>
</svg>
