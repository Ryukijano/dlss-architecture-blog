<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, Arial, sans-serif">
  <title>Sub-pixel jitter accumulates samples across frames</title>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Jitter: each frame samples slightly different spots</text>
  <!-- Output grid 4x4 (display pixels) -->
  <g transform="translate(40,70)">
    <text x="0" y="-12" font-size="15" fill="#444">Output grid (display res)</text>
    <g stroke="#bbb">
      <rect x="0" y="0" width="240" height="240" fill="#fafafa"/>
      <line x1="60" y1="0" x2="60" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/>
      <line x1="0" y1="60" x2="240" y2="60"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="180" x2="240" y2="180"/>
    </g>
    <!-- sample positions over 4 frames, each offset by a sub-pixel jitter -->
    <g>
      <circle cx="30" cy="30" r="6" fill="#3a6bc4"/>
      <circle cx="90" cy="150" r="6" fill="#c0392b"/>
      <circle cx="150" cy="90" r="6" fill="#76b900"/>
      <circle cx="210" cy="210" r="6" fill="#c77700"/>
    </g>
  </g>
  <!-- Legend and explanation -->
  <g transform="translate(330,70)" font-size="15" fill="#1a1a1a">
    <text x="0" y="20" font-weight="600">Four frames, four jitter offsets</text>
    <circle cx="10" cy="50" r="6" fill="#3a6bc4"/><text x="28" y="55">Frame 1 sample</text>
    <circle cx="10" cy="80" r="6" fill="#c0392b"/><text x="28" y="85">Frame 2 sample</text>
    <circle cx="10" cy="110" r="6" fill="#76b900"/><text x="28" y="115">Frame 3 sample</text>
    <circle cx="10" cy="140" r="6" fill="#c77700"/><text x="28" y="145">Frame 4 sample</text>
    <text x="0" y="195" fill="#444" font-size="14">Each frame is rendered at lower resolution, so it</text>
    <text x="0" y="217" fill="#444" font-size="14">holds fewer samples. Blending history from many frames</text>
    <text x="0" y="239" fill="#444" font-size="14">recovers detail the single frame could not show.</text>
    <text x="0" y="280" fill="#444" font-size="14">Without jitter, every frame samples the same spots,</text>
    <text x="0" y="302" fill="#444" font-size="14">so the output stays blurry and flickers.</text>
  </g>
</svg>
