<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
  <title>Multi Frame Generation: one shared network half, one small half per generated frame</title>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Multi Frame Generation: the network is split in two</text>
  <defs>
    <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>

  <!-- rendered frames -->
  <text x="30" y="78" font-size="14" font-weight="600" fill="#1a1a1a">Timeline (4x example: 3 generated frames)</text>
  <g font-size="15" text-anchor="middle" fill="#1a1a1a">
    <rect x="30" y="170" width="150" height="60" rx="8" fill="#3a6bc4"/><text x="105" y="206" fill="#ffffff" font-weight="600">Rendered A</text>
    <rect x="250" y="170" width="120" height="60" rx="8" fill="#76b900"/><text x="310" y="200">Generated</text><text x="310" y="218" font-size="13">t = 1/4</text>
    <rect x="410" y="170" width="120" height="60" rx="8" fill="#76b900"/><text x="470" y="200">Generated</text><text x="470" y="218" font-size="13">t = 2/4</text>
    <rect x="570" y="170" width="120" height="60" rx="8" fill="#76b900"/><text x="630" y="200">Generated</text><text x="630" y="218" font-size="13">t = 3/4</text>
    <rect x="780" y="170" width="150" height="60" rx="8" fill="#3a6bc4"/><text x="855" y="206" fill="#ffffff" font-weight="600">Rendered B</text>
  </g>

  <!-- shared half -->
  <rect x="30" y="100" width="900" height="44" rx="8" fill="#eef4ff" stroke="#3a6bc4" stroke-width="2"/>
  <text x="480" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Shared half: runs once per frame pair (A to B). Features and flow are reused.</text>
  <line x1="480" y1="144" x2="480" y2="166" stroke="#3a6bc4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>

  <!-- per-frame half -->
  <g font-size="13" text-anchor="middle" fill="#1a1a1a">
    <rect x="240" y="270" width="140" height="56" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="2"/><text x="310" y="294">Small half</text><text x="310" y="312">runs per frame</text>
    <rect x="400" y="270" width="140" height="56" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="2"/><text x="470" y="294">Small half</text><text x="470" y="312">runs per frame</text>
    <rect x="560" y="270" width="140" height="56" rx="8" fill="#fff4e5" stroke="#c77700" stroke-width="2"/><text x="630" y="294">Small half</text><text x="630" y="312">runs per frame</text>
  </g>
  <g stroke="#c77700" stroke-width="2" marker-end="url(#am)">
    <line x1="310" y1="268" x2="310" y2="234"/>
    <line x1="470" y1="268" x2="470" y2="234"/>
    <line x1="630" y1="268" x2="630" y2="234"/>
  </g>
  <text x="30" y="300" font-size="13" fill="#c77700" font-weight="600">Per generated frame:</text>
  <text x="30" y="318" font-size="13" fill="#444">input: shared output + t</text>

  <!-- hardware notes -->
  <g font-size="14" fill="#1a1a1a">
    <text x="30" y="370" font-weight="600">What NVIDIA states (ADLR DLSS 4 page)</text>
    <text x="30" y="390" fill="#444">· The network is split in half. One half runs once per input frame pair and its output is reused.</text>
    <text x="30" y="408" fill="#444">· The other, much smaller half runs once for every generated output frame.</text>
    <text x="30" y="426" fill="#444">· NVIDIA's stated purpose is to amortize shared work across the generated frames.</text>
  </g>
  <g font-size="13" fill="#444">
    <text x="30" y="454">Third-party analysis (not NVIDIA): the timestep t is index / (count + 1), inferred from reverse engineering of nvngx_dlssg.dll.</text>
    <text x="30" y="474">6x mode produces five generated frames per rendered frame, at t = 1/6 through 5/6.</text>
  </g>
</svg>
