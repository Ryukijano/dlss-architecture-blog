<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Arial, sans-serif">
  <title>Frame Generation Timeline: 2x, 4x MFG, and 6x Dynamic MFG</title>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Frame Generation &amp; Multi Frame Generation: 2x, 4x, and 6x Timelines</text>
  <g font-size="15" font-weight="600" fill="#1a1a1a">
    <text x="30" y="102">Rendered (Native)</text>
    <text x="30" y="182">2x FG (DLSS 3/4)</text>
    <text x="30" y="262">4x MFG (DLSS 4)</text>
    <text x="30" y="342">6x MFG (DLSS 4.5)</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="30" y="120">Engine real frames only</text>
    <text x="30" y="200">1 generated / real frame</text>
    <text x="30" y="280">Up to 3 generated / real</text>
    <text x="30" y="360">Up to 5 generated / real</text>
  </g>

  <!-- Row 1: Real frames -->
  <g>
    <rect x="220" y="80" width="140" height="42" rx="6" fill="#3a6bc4"/><text x="290" y="106" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real Frame 1</text>
    <rect x="640" y="80" width="140" height="42" rx="6" fill="#3a6bc4"/><text x="710" y="106" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real Frame 2</text>
  </g>

  <!-- Row 2: 2x FG -->
  <g>
    <rect x="220" y="160" width="140" height="42" rx="6" fill="#3a6bc4"/><text x="290" y="186" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real 1</text>
    <rect x="430" y="160" width="140" height="42" rx="6" fill="#76b900"/><text x="500" y="186" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Gen 1</text>
    <rect x="640" y="160" width="140" height="42" rx="6" fill="#3a6bc4"/><text x="710" y="186" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real 2</text>
  </g>

  <!-- Row 3: 4x MFG -->
  <g>
    <rect x="220" y="240" width="110" height="42" rx="6" fill="#3a6bc4"/><text x="275" y="266" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real 1</text>
    <rect x="342" y="240" width="88" height="42" rx="6" fill="#76b900"/><text x="386" y="266" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Gen 1</text>
    <rect x="442" y="240" width="88" height="42" rx="6" fill="#76b900"/><text x="486" y="266" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Gen 2</text>
    <rect x="542" y="240" width="88" height="42" rx="6" fill="#76b900"/><text x="586" y="266" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Gen 3</text>
    <rect x="640" y="240" width="140" height="42" rx="6" fill="#3a6bc4"/><text x="710" y="266" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real 2</text>
  </g>

  <!-- Row 4: 6x Dynamic MFG -->
  <g>
    <rect x="220" y="320" width="90" height="42" rx="6" fill="#3a6bc4"/><text x="265" y="346" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Real 1</text>
    <rect x="318" y="320" width="58" height="42" rx="5" fill="#76b900"/><text x="347" y="346" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">G1</text>
    <rect x="382" y="320" width="58" height="42" rx="5" fill="#76b900"/><text x="411" y="346" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">G2</text>
    <rect x="446" y="320" width="58" height="42" rx="5" fill="#76b900"/><text x="475" y="346" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">G3</text>
    <rect x="510" y="320" width="58" height="42" rx="5" fill="#76b900"/><text x="539" y="346" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">G4</text>
    <rect x="574" y="320" width="58" height="42" rx="5" fill="#76b900"/><text x="603" y="346" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="600">G5</text>
    <rect x="640" y="320" width="140" height="42" rx="6" fill="#3a6bc4"/><text x="710" y="346" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Real 2</text>
  </g>

  <text x="480" y="398" text-anchor="middle" font-size="14" fill="#1a1a1a">Hardware Flip Metering in the display engine paces generated frames at uniform intervals.</text>
  <text x="480" y="420" text-anchor="middle" font-size="13" fill="#444">Dynamic MFG (DLSS 4.5) automatically shifts multipliers between 1x and 6x to saturate the monitor's refresh rate.</text>
</svg>
